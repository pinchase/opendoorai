databases:
  - name: opendoors-ai-db
    plan: basic-256mb
    databaseName: opendoors_ai
    user: opendoors_ai

services:
  - type: web
    name: opendoors-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate --noinput && python manage.py createcachetable
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /healthz/
    disk:
      name: opendoors-ai-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: opendoors-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: opendoors-ai.onrender.com
      - key: CACHE_BACKEND
        value: django.core.cache.backends.db.DatabaseCache
      - key: CACHE_TABLE
        value: django_cache
      - key: AI_ENABLED
        value: "false"
      - key: EMAIL_ENABLED
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        value: OpenDoors AI <no-reply@opendoors-ai.onrender.com>
      - key: SECURE_SSL_REDIRECT
        value: "true"
